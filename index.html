<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu boudes ? 🥹</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Fredoka', 'Nunito', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animated gradient background */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(-45deg, #d81b60, #ff1744, #f48fb1, #c2185b, #ff4081);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Canvas positions */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #bgCanvas { z-index: 1; }
        #emojiRainCanvas { z-index: 50; }

        .butterfly {
            position: fixed;
            pointer-events: none;
            z-index: 40;
            font-size: 1.6rem;
            filter: drop-shadow(0 2px 8px rgba(255, 105, 180, 0.6));
            transition: transform 0.08s linear;
            will-change: transform;
            top: 0;
            left: 0;
            transform-origin: center center;
        }

        .butterfly-wing {
            display: inline-block;
            animation: flap 0.35s ease-in-out infinite alternate;
        }

        @keyframes flap {
            0% { transform: scaleX(1) scaleY(1) rotate(0deg); }
            100% { transform: scaleX(0.3) scaleY(0.9) rotate(10deg); }
        }

        .emoji-drop {
            position: fixed;
            pointer-events: none;
            z-index: 60;
            will-change: transform;
            /* Using CSS animation for performance instead of JS requestAnimationFrame */
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* Floating background elements */
        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 2;
            animation: floatUp linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.8; }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 50px rgba(136, 14, 79, 0.3);
        }

        .btn-dodge {
            transition: left 0.15s ease-out, top 0.15s ease-out, transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        /* Modal styling */
        .modal-overlay {
            background: rgba(136, 14, 79, 0.5);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            transform: scale(0.7) translateY(30px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen overflow-hidden select-none">

    <!-- Canvas for constellation particles -->
    <canvas id="bgCanvas"></canvas>
    
    <!-- Container for emoji rain (replaces canvas for better performance) -->
    <div id="emoji-rain-container" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

    <!-- Floating hearts background container -->
    <div id="hearts-container"></div>

    <!-- Butterflies cursor container -->
    <div id="butterflies-container"></div>

    <!-- Main Interactive Card -->
    <main class="relative z-10 p-6 sm:p-10 m-4 rounded-3xl glass-card text-center max-w-lg w-full transform hover:scale-[1.01] transition-all">
        <!-- Cute decorative header -->
        <div class="inline-block px-4 py-1.5 mb-4 rounded-full bg-white/30 text-white font-semibold text-sm tracking-wide shadow-inner">
            💖 Petit message spécial 💖
        </div>

        <h1 class="text-4xl sm:text-6xl font-extrabold text-white drop-shadow-md mb-8 tracking-wide">
            Tu boudes ?
        </h1>

        <!-- Buttons Container -->
        <div id="button-area" class="relative min-h-[140px] flex flex-wrap items-center justify-center gap-6 p-2">
            <!-- Non Button (Action Trigger) -->
            <button id="btn-non" class="px-8 py-4 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white text-xl sm:text-2xl font-bold rounded-2xl shadow-lg hover:shadow-2xl transform hover:-translate-y-1 active:translate-y-0 transition-all duration-200 border-2 border-white/50 cursor-pointer">
                Non 🥹
            </button>

            <!-- Oui Button (Random Link Trigger) -->
            <button id="btn-oui" class="px-8 py-4 bg-white/80 hover:bg-white text-rose-600 text-xl sm:text-2xl font-bold rounded-2xl shadow-lg border-2 border-rose-300 cursor-pointer transform hover:-translate-y-1 active:translate-y-0 transition-all duration-200">
                Oui 🥺
            </button>
        </div>
    </main>

    <!-- Pretty Modal Popup -->
    <div id="hugModal" class="modal-overlay fixed inset-0 z-40 flex items-center justify-center p-4">
        <div class="modal-card glass-card p-8 sm:p-10 rounded-3xl text-center max-w-md w-full bg-white/90 border-2 border-pink-300 shadow-2xl relative overflow-hidden">
            <!-- Background glow inside modal -->
            <div class="absolute -top-12 -left-12 w-32 h-32 bg-pink-300/40 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-rose-400/40 rounded-full blur-2xl"></div>

            <div class="text-6xl mb-4 animate-bounce">🤗</div>

            <h2 class="text-2xl sm:text-3xl font-extrabold text-rose-700 mb-6 leading-tight">
                Uiiiiiiii, tu veux un câlin ?
            </h2>

            <button id="btn-modal-oui" class="w-full py-4 bg-gradient-to-r from-rose-500 via-pink-500 to-rose-600 text-white text-xl font-extrabold rounded-2xl shadow-xl hover:shadow-2xl transform hover:scale-105 active:scale-95 transition-all border-2 border-white/60 cursor-pointer">
                Ouiiii ! 🥰
            </button>
        </div>
    </div>

    <script>
        // Mouse Coordinates tracking
        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            isScattering = false; // Stop scattering on mouse move (desktop)
        });

        // Touch Events for Mobile Behavior
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
                isScattering = false; // Stop scattering and snap back to finger
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
                isScattering = false;
            }
        });

        window.addEventListener('touchend', () => {
            // Trigger slow scatter mode when finger is lifted
            isScattering = true;
            // Assign a random gentle drift direction to each butterfly
            butterflies.forEach(b => {
                const angle = Math.random() * Math.PI * 2;
                b.scatterVx = Math.cos(angle) * (Math.random() * 0.5 + 0.2); // Slow drift speed
                b.scatterVy = Math.sin(angle) * (Math.random() * 0.5 + 0.2);
            });
        });

        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');

        let particles = [];
        const particleCount = 65;
        const maxDistance = 130;

        function resizeBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBgCanvas);
        resizeBgCanvas(); // CRITICAL: Call this BEFORE initializing particles

        class Particle {
            constructor() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.radius = Math.random() * 2 + 1.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > bgCanvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > bgCanvas.height) this.vy *= -1;
            }

            draw() {
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                bgCtx.fill();
            }
        }

        // Initialize particles AFTER canvas is sized correctly
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateBgCanvas() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

            // Connect particles with translucent lines
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        const alpha = (1 - dist / maxDistance) * 0.45;
                        bgCtx.beginPath();
                        bgCtx.moveTo(particles[i].x, particles[i].y);
                        bgCtx.lineTo(particles[j].x, particles[j].y);
                        bgCtx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                        bgCtx.lineWidth = 1;
                        bgCtx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateBgCanvas);
        }
        animateBgCanvas();

        const heartsContainer = document.getElementById('hearts-container');
        const heartEmojis = ['💖', '❤️', '💕', '💗', '🌸', '✨'];

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            
            const duration = Math.random() * 5 + 6;
            heart.style.animationDuration = duration + 's';

            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createFloatingHeart, 450);

        const butterfliesContainer = document.getElementById('butterflies-container');
        const butterflies = [];
        const numButterflies = 12;
        let isScattering = false; // New state variable

        for (let i = 0; i < numButterflies; i++) {
            const el = document.createElement('div');
            el.className = 'butterfly';
            el.innerHTML = `<span class="butterfly-wing">🦋</span>`;
           
            butterfliesContainer.appendChild(el);

            butterflies.push({
                element: el,
                x: window.innerWidth / 2,
                y: window.innerHeight / 2,
                vx: 0,
                vy: 0,
                scatterVx: 0, // Velocity during scatter
                scatterVy: 0, // Velocity during scatter
                angle: 0,
                offsetX: (Math.random() - 0.5) * 70,
                offsetY: (Math.random() - 0.5) * 70,
                speed: 0.04 + Math.random() * 0.04
            });
        }

        function updateButterflies() {
            const time = Date.now() * 0.003;

            butterflies.forEach((b, index) => {
                if (isScattering) {
                    // Mobile: Finger lifted, slowly drift away
                    b.x += b.scatterVx;
                    b.y += b.scatterVy;
                    
                    // Bounce off screen edges softly
                    if (b.x < 0 || b.x > window.innerWidth) b.scatterVx *= -1;
                    if (b.y < 0 || b.y > window.innerHeight) b.scatterVy *= -1;
                    
                    const rot = (b.scatterVx) * 10; // Slight rotation based on drift
                    b.element.style.transform = `translate3d(${b.x - 12}px, ${b.y - 12}px, 0) rotate(${rot}deg)`;

                } else {
                    // Desktop or Finger on screen: Follow target
                    const targetX = mouse.x + b.offsetX + Math.sin(time + index) * 25;
                    const targetY = mouse.y + b.offsetY + Math.cos(time * 0.8 + index) * 25;

                    b.x += (targetX - b.x) * b.speed;
                    b.y += (targetY - b.y) * b.speed;

                    const dx = targetX - b.x;
                    const rot = dx * 1.5;
                    b.element.style.transform = `translate3d(${b.x - 12}px, ${b.y - 12}px, 0) rotate(${rot}deg)`;
                }
            });

            requestAnimationFrame(updateButterflies);
        }
        updateButterflies();

        const btnOui = document.getElementById('btn-oui');
        const btnNon = document.getElementById('btn-non');

        // Array of random YouTube links
        const youtubeLinks = [
            "https://www.youtube.com/watch?v=Y-U1calv6X8", // sad cat
            "https://www.youtube.com/watch?v=qFztWkQMiE0", // sara perche ti amo
            "https://www.youtube.com/watch?v=v8usOVv5iX0", // t'es parfait(e)
            "https://www.youtube.com/watch?v=xYpZVNNRaRY"  // hou la menteuse
        ];

        btnOui.addEventListener('click', () => {
            // Select a random link from the array
            const randomLink = youtubeLinks[Math.floor(Math.random() * youtubeLinks.length)];
            // Open in a new tab
            window.open(randomLink, '_blank');
        });

        const hugModal = document.getElementById('hugModal');
        const btnModalOui = document.getElementById('btn-modal-oui');

        btnNon.addEventListener('click', () => {
            hugModal.classList.add('active');
        });

        const emojiRainContainer = document.getElementById('emoji-rain-container');
        const rainEmojis = ['🤗', '😘', '💋', '❤️', '💖', '🥰', '💕', '🫂', '❤️‍🔥', '⭐'];
        let isRaining = false;
        let rainInterval;

        function createRainDrop() {
            if (!isRaining) return;

            const drop = document.createElement('div');
            drop.className = 'emoji-drop';
            drop.innerText = rainEmojis[Math.floor(Math.random() * rainEmojis.length)];
            
            // Randomize starting position, size, and speed
            const startX = Math.random() * window.innerWidth;
            const size = Math.random() * 20 + 20; // 20px to 40px
            const duration = Math.random() * 2 + 3; // 3s to 5s fall time

            drop.style.left = `${startX}px`;
            drop.style.top = `-50px`; // Start just above the screen
            drop.style.fontSize = `${size}px`;
            drop.style.animationDuration = `${duration}s`;

            emojiRainContainer.appendChild(drop);

            // Cleanup the element after animation finishes
            setTimeout(() => {
                if(drop.parentNode) {
                    drop.remove();
                }
            }, duration * 1000);
        }

        function startEmojiRain() {
            if (!isRaining) {
                isRaining = true;
                
                // Burst initially
                for(let i=0; i<30; i++) {
                     setTimeout(createRainDrop, Math.random() * 500);
                }

                // Continuous rain
                rainInterval = setInterval(() => {
                    // Create multiple drops per tick for heavy rain
                    createRainDrop();
                    createRainDrop();
                    createRainDrop();
                }, 100);
            }
        }

        btnModalOui.addEventListener('click', () => {
            hugModal.classList.remove('active');
            startEmojiRain();
        });
    </script>
</body>
</html>
